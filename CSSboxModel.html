<!DOCTYPE html>

<html>

<head>

    <title>CSS Box Model</title>

    <style>

        body {

            font-family: Arial;

            background-color: lightblue;

            text-align: center;

        }

        .box {

            background-color: lightyellow;

            padding: 20px;

            border: 5px solid blue;

            margin: 30px;

        }

    </style>

</head>

<body>

    <h1>CSS Box Model</h1>

    <p>The CSS Box Model has four parts:</p>

    <div class="box">

        <h2>Content</h2>

        <p>The content is the text or image inside the box.</p>

        <p>Padding is the space around the content.</p>

        <p>Border is the line around the padding.</p>

        <p>Margin is the space outside the border.</p>

    </div>

</body>

</html>
